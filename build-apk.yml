name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        if: ${{ secrets.JARVIS_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.JARVIS_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
          echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"
          echo "JARVIS_KEYSTORE_PASSWORD=${{ secrets.JARVIS_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_ALIAS=${{ secrets.JARVIS_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_PASSWORD=${{ secrets.JARVIS_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed JARVIS release APK
        if: ${{ secrets.JARVIS_KEYSTORE_BASE64 != '' }}
        run: gradle assembleRelease --no-daemon

      - name: Build JARVIS debug APK (fallback)
        if: ${{ secrets.JARVIS_KEYSTORE_BASE64 == '' }}
        run: gradle assembleDebug --no-daemon

      - name: Upload signed release APK
        if: ${{ secrets.JARVIS_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V2.2-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK fallback
        if: ${{ secrets.JARVIS_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V2.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
